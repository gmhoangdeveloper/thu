<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vệ sinh trường học – Nên và Không nên</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfeaff;
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    font-family:"Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif;color:#2c2442}
  #viewport{position:fixed;inset:0;background:linear-gradient(180deg,#dff3ff 0%,#eef8ff 55%,#fff4dc 100%)}
  #stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden}
  img{-webkit-user-drag:none;user-select:none;pointer-events:none}

  .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.75}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:150%;left:15%;top:-70%}
  .cloud::after{width:40%;height:120%;left:50%;top:-45%}
  .ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(#f3dfb4,#e9cf9a);border-top:3px solid #e2c286}
  #tray{position:absolute;left:18px;top:140px;width:690px;height:620px;border-radius:36px;
    background:rgba(255,255,255,.45);border:3px dashed rgba(150,140,200,.35)}

  #pot{position:absolute;z-index:1}
  #potText{position:absolute;z-index:2;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;
    font-size:23px;font-weight:900;letter-spacing:.4px;color:#fff;
    text-shadow:0 2px 0 #c2283a,1.5px 1.5px 0 #c2283a,-1.5px 1.5px 0 #c2283a,1.5px -1.5px 0 #c2283a,-1.5px -1.5px 0 #c2283a,0 0 6px rgba(150,20,40,.5)}

  .center{position:absolute;z-index:30;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:transform .2s ease, filter .2s ease}
  .center img{position:absolute;inset:0;width:100%;height:100%}
  .center span{position:relative;font-weight:900;text-align:center;line-height:1.05;
    text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 2px #fff}
  #cY span{font-size:27px;color:#8a4a00}
  #cP span{font-size:19px;color:#8f1452}
  .center.hot{transform:scale(1.12);filter:drop-shadow(0 0 14px #fff) drop-shadow(0 0 22px rgba(120,170,255,.9))}
  .center.bloom{animation:bloom 1.6s ease-in-out infinite}
  @keyframes bloom{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  .petal{position:absolute;width:var(--pw);height:var(--ph);z-index:10;touch-action:none;cursor:grab;
    transition:left .45s cubic-bezier(.2,1.25,.4,1), top .45s cubic-bezier(.2,1.25,.4,1), transform .5s cubic-bezier(.2,1.15,.4,1)}
  .petal.dragging{transition:transform .25s ease;z-index:100;cursor:grabbing}
  .petal.placed{z-index:24;cursor:pointer}
  .petal.open{z-index:22;cursor:default}
  .petal.open.grow{transition:transform .8s cubic-bezier(.2,1.6,.35,1)}
  .petal.wilt{z-index:23;cursor:default;transition:transform 1.4s cubic-bezier(.5,0,.3,1.2)}
  .petal .inner{position:absolute;inset:0;transition:transform .15s ease, filter 1.2s ease;
    filter:drop-shadow(0 4px 5px rgba(60,40,80,.25))}
  .petal.dragging .inner{transform:scale(1.08);filter:drop-shadow(0 12px 14px rgba(60,40,80,.35))}
  .petal.wilt .inner{filter:grayscale(.55) sepia(.85) saturate(.75) hue-rotate(-12deg) brightness(.78) drop-shadow(0 3px 3px rgba(60,40,20,.3))}
  .petal.open.glow .inner{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 16px rgba(80,220,120,.95))}
  .petal .inner img{position:absolute;inset:0;width:100%;height:100%}
  .petal .label{position:absolute;left:50%;top:50%;width:128px;height:96px;margin:-48px 0 0 -64px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:17px;font-weight:800;line-height:1.12;color:#2a2340;
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 5px rgba(255,255,255,.9);
    transition:transform .5s cubic-bezier(.2,1.15,.4,1), color 1.2s, opacity 1.2s}
  .petal.dragging .label{transition:transform .25s ease}
  .petal.open.grow .label{transition:transform .8s cubic-bezier(.2,1.6,.35,1)}
  .petal.wilt .label{color:#5a4632;transition:transform 1.4s cubic-bezier(.5,0,.3,1.2), color 1.2s}
  .petal.placed:not(.open):not(.wilt) .inner{animation:breathe 2.4s ease-in-out infinite}
  .petal .label span{display:inline-block;transition:transform .5s ease}
  .petal.placed:not(.open) .label span{transform:scale(1.22)}
  .petal.wilt .label span{transform:scale(1.3)}
  .btn:disabled{opacity:.75;cursor:default}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

  #title{position:absolute;left:30px;top:22px;width:720px}
  #title h1{margin:0;font-size:36px;line-height:1.1;font-weight:900;color:#d0347a;
    text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff}
  #title h1 b{color:#e08a00}
  #title p{margin:6px 0 0;font-size:20px;font-weight:700;color:#3b3560}
  #score{position:absolute;right:28px;top:26px;background:#fff;border-radius:22px;padding:10px 22px;
    font-size:28px;font-weight:900;color:#5b4bb7;box-shadow:0 4px 0 #d6d0f2, 0 6px 16px rgba(0,0,0,.08)}
  #score small{font-size:17px;color:#556;font-weight:700;margin-right:6px}

  .btns{position:absolute;bottom:62px;display:flex;gap:14px}
  #btnsL{left:28px}
  .btn{border:0;border-radius:18px;padding:14px 22px;font:inherit;font-size:21px;font-weight:800;cursor:pointer;
    background:#fff;color:#3b3560;box-shadow:0 5px 0 #c9c3e6, 0 8px 18px rgba(0,0,0,.08);touch-action:manipulation}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c9c3e6}
  .btn.main{background:#2fb35a;color:#fff;box-shadow:0 5px 0 #1f7f3e, 0 8px 18px rgba(0,0,0,.1)}
  .btn.main:active{box-shadow:0 2px 0 #1f7f3e}
  .btn.pink{background:#ff6fa6;color:#fff;box-shadow:0 5px 0 #c94a7d, 0 8px 18px rgba(0,0,0,.1)}
  .btn.pink:active{box-shadow:0 2px 0 #c94a7d}
  .btn.icon{width:62px;padding:14px 0;font-size:24px}
  .btn.icon.off{opacity:.45;filter:grayscale(1)}

  .bubble{position:absolute;z-index:120;padding:10px 18px;border-radius:18px;font-size:22px;font-weight:900;
    white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) scale(.6);opacity:0;
    background:#5b4bb7;color:#fff;box-shadow:0 5px 0 #3f3290;
    transition:opacity .2s, transform .25s cubic-bezier(.2,1.5,.4,1)}
  .bubble.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  #result{position:absolute;left:363px;top:450px;z-index:200;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;
    background:#fff;border-radius:32px;padding:26px 36px 28px;text-align:center;width:600px;
    box-shadow:0 9px 0 #d6d0f2, 0 20px 50px rgba(60,40,120,.22);transition:opacity .25s, transform .35s cubic-bezier(.2,1.5,.4,1)}
  #result.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  #result h2{margin:0 0 4px;font-size:44px;font-weight:900;color:#d0347a}
  #result .big{font-size:30px;font-weight:900;margin:4px 0}
  #result .big .g{color:#2fb35a} #result .big .r{color:#a0703c}
  #result p{margin:4px 0 18px;font-size:21px;font-weight:700;color:#3b3560}
  #result .row{display:flex;gap:14px;justify-content:center}
  #fx{position:absolute;inset:0;z-index:150;pointer-events:none}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="cloud" style="left:860px;top:60px;width:130px;height:40px"></div>
    <div class="cloud" style="left:1370px;top:200px;width:170px;height:48px"></div>
    <div class="cloud" style="left:1400px;top:650px;width:150px;height:42px;opacity:.5"></div>
    <div class="ground"></div>
    <div id="tray"></div>

    <div id="title">
      <h1><b>NÊN</b> hay KHÔNG NÊN?</h1>
      <p id="sub">Kéo đủ 8 cánh hoa vào bông rồi bấm “Xác nhận” nhé!</p>
    </div>
    <div id="score"><small>Đã gắn</small><span id="scoreN">0</span> / <span id="scoreT">8</span></div>

    <img id="pot" alt="">
    <div id="potText">Vệ sinh trường học</div>
    <div class="center" id="cY"><img alt=""><span>NÊN<br>LÀM</span></div>
    <div class="center" id="cP"><img alt=""><span>KHÔNG<br>NÊN LÀM</span></div>

    <div class="btns" id="btnsL">
      <button class="btn main" id="bConfirm">✔ Xác nhận</button>
      <button class="btn pink" id="bReset">↻ Chơi lại</button>
      <button class="btn icon" id="bMusic" title="Tắt nhạc nền">🎵</button>
      <button class="btn icon" id="bPick" title="Chọn bài nhạc khác từ máy">📂</button>
      <button class="btn icon" id="bSound" title="Bật/tắt tiếng hiệu ứng">🔊</button>
      <input type="file" id="fileMusic" accept="audio/*" hidden>
      <button class="btn icon" id="bFull" title="Toàn màn hình">⛶</button>
    </div>

    <canvas id="fx" width="1600" height="900"></canvas>
    <div id="result">
      <h2 id="rTitle">Kết quả</h2>
      <div class="big" id="rBig"></div>
      <p id="rMsg"></p>
      <div class="row"><button class="btn" id="bClose">Đóng</button><button class="btn pink" id="bAgain">↻ Chơi lại</button></div>
    </div>
  </div>
</div>

/* ===== Âm thanh ===== */
let ac = null, soundOn = true;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); return ac; }
function tone(freq, t0, dur, type='sine', vol=.16, toFreq=null){
  const c = audio(); if(!c || !soundOn) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime+t0;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
/* Âm thanh ĐÚNG: chuông "ting ting" vui + lấp lánh */
function bell(freq, t0, dur, vol){
  const c = audio(); if(!c || !soundOn) return;
  const t = c.currentTime + t0;
  [[1,1],[2,.35],[3,.12]].forEach(([h,v])=>{          // âm cơ bản + bồi âm cho giống chuông
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=freq*h;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol*v,t+.008);
    g.gain.exponentialRampToValueAtTime(.0005,t+dur/h);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
  });
}
function sfxCorrect(){
  [1047,1319,1568,2093].forEach((f,i)=>bell(f, i*.09, 1.1, .32));
  bell(2637, .42, 1.2, .22); bell(3136, .5, 1.2, .16);
}
/* Âm thanh SAI: kèn "oà oà oà oàaa" buồn */
function sfxWrong(){
  const c = audio(); if(!c || !soundOn) return;
  const t0 = c.currentTime + .02;
  const notes = [[392,0,.32],[370,.36,.32],[349,.72,.32],[330,1.08,1.0]];
  notes.forEach(([f,s,d],i)=>{
    const o=c.createOscillator(), fl=c.createBiquadFilter(), g=c.createGain(), t=t0+s;
    o.type='sawtooth'; o.frequency.setValueAtTime(f,t);
    if(i===3){ const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=6; lg.gain.value=9;
      lfo.connect(lg).connect(o.frequency); lfo.start(t+.15); lfo.stop(t+d); o.frequency.linearRampToValueAtTime(f*.94,t+d); }
    fl.type='lowpass'; fl.Q.value=6;
    fl.frequency.setValueAtTime(500,t); fl.frequency.linearRampToValueAtTime(1600,t+.08); fl.frequency.linearRampToValueAtTime(600,t+d);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.26,t+.04); g.gain.setValueAtTime(.26,t+d*.7); g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(fl).connect(g).connect(c.destination); o.start(t); o.stop(t+d+.05);
  });
}
/* hạ nhỏ nhạc nền khi có âm thanh đúng/sai để nghe rõ */
function duckMusic(sec){
  if(typeof Music!=='undefined') Music.duck(sec);
  if(typeof customAudio!=='undefined' && customAudio){ const v=customAudio.volume; customAudio.volume=.12; setTimeout(()=>customAudio && (customAudio.volume=.45), sec*1000); }
}
const sfx = {
  pick(){ tone(660,0,.08,'triangle',.08); },
  place(){ tone(880,0,.1,'triangle',.1); },
  grow(){ duckMusic(1.6); sfxCorrect(); },
  wilt(){ duckMusic(2.2); sfxWrong(); },
  bloom(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.4,'triangle',.15)); },
  win(){ [784,988,1175,1568].forEach((f,i)=>tone(f,.5+i*.12,.45,'triangle',.15)); }
};

/* ===== Cánh hoa ===== */
let petals = [];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const ORIGIN_SELF = '50% 50%';
const ORIGIN_FLOWER = `50% ${PH + BASE}px`;   // tâm nhụy

function setPos(p, cx, cy){ p.el.style.left = (cx-PW/2)+'px'; p.el.style.top = (cy-PH/2)+'px'; p.cx = cx; p.cy = cy; }
function setT(p, deg, sx=1, sy=sx, push=0){
  p.rot = deg; p.sx = sx; p.sy = sy; p.push = push;
  p.el.style.transform = `rotate(${deg}deg) translateY(${-push}px) scale(${sx},${sy})`;
  p.label.style.transform = `rotate(${-deg}deg)`;
}

function build(){
  petals.forEach(p=>p.el.remove()); petals = [];
  Object.values(FLOWERS).forEach(f=>{ f.slot = f.angles.map(()=>null); f.bloomed = false; f.el.classList.remove('bloom'); });
  const items = [...NEN.map(t=>({t,g:'nen'})), ...KHONG.map(t=>({t,g:'khong'}))];
  const skins = shuffle(items.map((_,i)=>i % A.petals.length));
  const homes = shuffle(HOMES.slice());
  items.forEach((it,i)=>{
    const el = document.createElement('div'); el.className = 'petal';
    el.innerHTML = `<div class="inner"><img alt=""></div><div class="label"><span></span></div>`;
    el.querySelector('img').src = A.petals[skins[i]];
    const label = el.querySelector('.label'); label.querySelector('span').textContent = it.t;
    if(it.t.length > 24) label.style.fontSize = '15px';
    stage.insertBefore(el, document.getElementById('fx'));
    const p = {el, label, group:it.g, home:homes[i], flower:null, slot:-1, state:'tray',
               pid:null, dx:0, dy:0, sx0:0, sy0:0, moved:false, rot:0, sx:1, sy:1};
    el.style.transformOrigin = ORIGIN_SELF;
    setPos(p, p.home[0], p.home[1]); setT(p, 0);
    el.addEventListener('pointerdown', e=>down(e,p));
    el.addEventListener('pointermove', e=>move(e,p));
    el.addEventListener('pointerup', e=>up(e,p));
    el.addEventListener('pointercancel', e=>up(e,p));
    petals.push(p);
  });
  document.getElementById('result').classList.remove('show');
  confirmed = false;
  const bc = document.getElementById('bConfirm'); bc.textContent = '✔ Xác nhận'; bc.disabled = false;
  document.getElementById('sub').textContent = `Kéo đủ ${TOTAL} cánh hoa vào bông rồi bấm “Xác nhận” nhé!`;
  document.getElementById('scoreT').textContent = TOTAL;
  updateScore(); fxClear();
}

function nearest(x,y){
  let best=null, bd=1e9;
  for(const k in FLOWERS){ const f=FLOWERS[k]; const d=Math.hypot(x-f.x,y-f.y); if(d<bd){bd=d;best=f;} }
  return bd < SNAP_DIST ? best : null;
}
function highlight(f){ Object.values(FLOWERS).forEach(o=>o.el.classList.toggle('hot', o===f)); }

/* nhấc cánh đang là nụ ra khỏi bông (không làm hình nhảy) */
function unplace(p){
  if(!p.flower) return;
  p.flower.slot[p.slot] = null;
  const a = p.rot*Math.PI/180, dist = (BASE + PH/2)*p.sy + (p.push||0);
  const vx = p.flower.x + Math.sin(a)*dist, vy = p.flower.y - Math.cos(a)*dist;
  p.el.style.transformOrigin = ORIGIN_SELF;
  setPos(p, vx, vy);
  p.flower = null; p.slot = -1; p.state = 'tray'; p.el.classList.remove('placed');
}
function startDrag(p){
  p.el.classList.add('dragging');
  unplace(p);
  p.dx = p.sx0 - p.cx; p.dy = p.sy0 - p.cy;
  setT(p, 0, 1);
  updateScore(); sfx.pick();
}

function down(e,p){
  if(p.pid!==null || p.state==='open' || p.state==='wilt') return;
  if(confirmed && p.state==='tray') return;
  e.preventDefault(); audio();
  p.pid = e.pointerId; p.el.setPointerCapture(e.pointerId);
  const s = toStage(e); p.sx0 = s.x; p.sy0 = s.y; p.moved = false; p.noTap = false;
  if(p.state==='tray'){ p.moved = true; startDrag(p); }      // cánh ở khay: kéo ngay
}
function move(e,p){
  if(p.pid!==e.pointerId) return;
  const s = toStage(e);
  if(!p.moved){                                            // nụ trên bông: chỉ kéo khi di chuyển đủ xa
    if(confirmed){ if(Math.hypot(s.x-p.sx0, s.y-p.sy0) >= TAP_MOVE) p.noTap = true; return; }  // đã xác nhận: không kéo nữa
    if(Math.hypot(s.x-p.sx0, s.y-p.sy0) < TAP_MOVE) return;
    p.moved = true; startDrag(p);
  }
  const x = Math.max(50, Math.min(1550, s.x - p.dx)), y = Math.max(60, Math.min(850, s.y - p.dy));
  setPos(p, x, y);
  highlight(nearest(x, y));
}
function up(e,p){
  if(p.pid!==e.pointerId) return;
  p.pid = null;
  if(!p.moved){                                            // chạm vào nụ
    if(p.state==='bud' && !p.noTap){ if(confirmed) reveal(p); else bubble(p.flower,'Bấm “Xác nhận” trước nhé'); }
    return;
  }
  p.el.classList.remove('dragging'); highlight(null);
  const f = nearest(p.cx, p.cy);
  if(!f){ goHome(p); return; }
  const ang = Math.atan2(p.cx-f.x, -(p.cy-f.y))*180/Math.PI;
  if(!place(p, f, ang)){ bubble(f,`Bông hoa đã đủ ${f.angles.length} cánh`); goHome(p); return; }
  sfx.place();
}
function goHome(p){ setPos(p, p.home[0], p.home[1]); setT(p,0,1); }

function nearRot(cur, a){ let t=a; while(t-cur>180) t-=360; while(t-cur<-180) t+=360; return t; }
function place(p, f, dropAngle){
  let bi=-1, bd=1e9;
  f.angles.forEach((a,i)=>{ if(f.slot[i]) return; const d=Math.abs(((dropAngle-a)%360+540)%360-180); if(d<bd){bd=d;bi=i;} });
  if(bi<0) return false;
  f.slot[bi] = p; p.flower = f; p.slot = bi; p.state = 'bud';
  p.el.style.transformOrigin = ORIGIN_FLOWER;              // rot = 0, scale = 1 nên đổi tâm không làm nhảy hình
  p.el.classList.add('placed');
  setPos(p, f.x, f.y - BASE - PH/2); setT(p, nearRot(p.rot, f.angles[bi]), BUD, BUD, BUD_PUSH);
  updateScore();
  return true;
}
function updateScore(){ document.getElementById('scoreN').textContent = petals.filter(p=>p.flower).length; }

/* ===== Cô giáo chạm để mở đáp án ===== */
function reveal(p){
  if(p.state!=='bud') return;
  const f = p.flower, a = f.angles[p.slot];
  if(f.key === p.group){
    p.state = 'open'; p.el.classList.add('open','grow','glow');
    setT(p, a, 1);
    sparkle(f.x + Math.sin(a*Math.PI/180)*130, f.y - Math.cos(a*Math.PI/180)*130, 22);
    sfx.grow();
    setTimeout(()=>p.el.classList.remove('glow'), 1200);
  } else {
    p.state = 'wilt'; p.el.classList.add('wilt');
    // rủ xuống phía dưới + teo lại
    let diff = ((180 - a)%360+540)%360-180;               // hướng về phía dưới
    const droop = Math.sign(diff||1)*Math.min(22, Math.abs(diff));
    setT(p, nearRot(p.rot, a + droop), 0.74, 0.68, 22);
    sfx.wilt();
  }
  setTimeout(()=>checkFlower(f), 900);
}
function checkFlower(f){
  if(f.bloomed) return;
  if(f.slot.every(s=>s && s.state!=='bud')){
    f.bloomed = true; burst(f);
  }
  checkAllDone();
}
/* bông hoa bung nở: các cánh đúng xoè rộng ra rồi đung đưa */
function burst(f){
  sfx.bloom();
  f.el.classList.add('bloom');
  f.slot.forEach((p,i)=>{
    if(p.state!=='open') return;
    setTimeout(()=>{
      p.el.classList.add('grow');
      setT(p, p.rot, 1.22);
      setTimeout(()=>setT(p, p.rot, 1.06), 450);
    }, i*90);
  });
  sparkle(f.x, f.y, 70, 260);
}
function checkAllDone(){
  if(!Object.values(FLOWERS).every(f=>f.bloomed)) return;
  const ok = petals.filter(p=>p.state==='open').length, bad = petals.filter(p=>p.state==='wilt').length;
  const t = document.getElementById('rTitle'), big = document.getElementById('rBig'), msg = document.getElementById('rMsg');
  big.innerHTML = `<span class="g">🌸 Cánh tươi: ${ok}</span> &nbsp; <span class="r">🥀 Cánh héo: ${bad}</span>`;
  if(ok===TOTAL){ t.textContent='Hoa đã nở rồi! 🌸'; msg.textContent='Cả lớp giỏi quá! Hãy cùng giữ gìn vệ sinh trường học nhé.'; confetti(); sfx.win(); }
  else { t.textContent='Hoa đã nở!'; msg.textContent='Cánh héo là việc đặt chưa đúng bông. Cả lớp cùng sửa lại nhé!'; }
  setTimeout(()=>document.getElementById('result').classList.add('show'), 1200);
}
function confirmAll(){
  audio();
  if(confirmed) return;
  const left = petals.filter(p=>!p.flower).length;
  if(left){ bubbleAt(330, 730, `Còn ${left} cánh hoa chưa gắn`); sfx.pick(); return; }
  confirmed = true;
  const b = document.getElementById('bConfirm'); b.textContent = '✔ Đã xác nhận'; b.disabled = true;
  document.getElementById('sub').textContent = 'Cô giáo chạm vào từng cánh hoa để kiểm tra kết quả!';
  Object.values(FLOWERS).forEach(f=>sparkle(f.x, f.y, 30, 180));
  sfx.place(); tone(1319,.12,.25,'triangle',.12);
}

let bubbleT = null;
function bubble(f, text){ bubbleAt(f.x, f.y + 100, text); }
function bubbleAt(x, y, text){
  let b = document.getElementById('bub');
  if(!b){ b = document.createElement('div'); b.id='bub'; stage.appendChild(b); }
  b.className = 'bubble'; b.textContent = text;
  b.style.left = x+'px'; b.style.top = y+'px';
  requestAnimationFrame(()=>b.classList.add('show'));
  clearTimeout(bubbleT); bubbleT = setTimeout(()=>b.classList.remove('show'), 1400);
}

/* ===== Hiệu ứng lấp lánh + pháo giấy ===== */
const cv = document.getElementById('fx'), g2 = cv.getContext('2d');
let parts = [], raf = null;
const COLS = ['#ff6fa6','#ffd34d','#6cc3ff','#b48cff','#ff9a4d','#5ad18a','#ffffff'];
function sparkle(x,y,n,spd=120){
  for(let i=0;i<n;i++){ const a=Math.random()*6.283, v=(.4+Math.random()*.6)*spd/40;
    parts.push({k:'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,r:4+Math.random()*6,c:COLS[i%COLS.length]}); }
  run();
}
function confetti(){
  for(let i=0;i<180;i++) parts.push({k:'paper',x:Math.random()*1600,y:-20-Math.random()*600,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,
    r:6+Math.random()*8,a:Math.random()*6.28,va:(Math.random()-.5)*.25,c:COLS[i%6],life:1});
  run();
}
function star(x,y,r){ g2.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?r*.45:r, a=i*Math.PI/5-Math.PI/2; g2.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} g2.closePath(); g2.fill(); }
function run(){
  if(raf) return;
  (function loop(){
    g2.clearRect(0,0,1600,900);
    parts = parts.filter(p=>p.k==='paper' ? p.y<940 : p.life>0);
    for(const p of parts){
      g2.fillStyle=p.c;
      if(p.k==='star'){ p.x+=p.vx; p.y+=p.vy; p.vy+=.03; p.vx*=.97; p.vy*=.97; p.life-=.018; g2.globalAlpha=Math.max(0,p.life); star(p.x,p.y,p.r); g2.globalAlpha=1; }
      else { p.x+=p.vx; p.y+=p.vy; p.a+=p.va; g2.save(); g2.translate(p.x,p.y); g2.rotate(p.a); g2.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); g2.restore(); }
    }
    if(parts.length) raf=requestAnimationFrame(loop); else { raf=null; g2.clearRect(0,0,1600,900); }
  })();
}
function fxClear(){ parts=[]; }

/* ===== Nhạc nền (tự sáng tác, phát bằng trình duyệt, không cần file) ===== */
const Music = (()=>{
  const BPM = 112, E8 = 60/BPM/2;               // độ dài 1 nốt móc đơn
  const _ = null;
  // giai điệu: [nốt MIDI, số móc đơn] – mỗi ô nhịp 8 móc đơn
  const MEL = [
    [[76,2],[79,2],[76,1],[74,1],[72,2]], [[74,2],[71,2],[74,2],[79,2]],
    [[76,2],[72,1],[76,1],[81,2],[79,2]], [[77,2],[76,2],[74,4]],
    [[76,2],[79,2],[84,2],[79,2]],        [[81,1],[79,1],[77,1],[76,1],[74,4]],
    [[77,2],[81,2],[79,2],[74,2]],        [[72,6],[_,2]],
    [[69,2],[72,2],[77,2],[76,2]],        [[76,3],[74,1],[72,4]],
    [[71,2],[74,2],[79,2],[77,2]],        [[76,6],[_,2]],
    [[77,2],[77,1],[79,1],[81,2],[77,2]], [[79,2],[76,2],[72,4]],
    [[74,2],[76,1],[77,1],[79,2],[71,2]], [[72,6],[_,2]]
  ];
  const C=[48,[60,64,67]], G=[43,[59,62,67]], Am=[45,[57,60,64]], F=[41,[57,60,65]];
  const CH = [C,G,Am,F, C,G,F,C, F,C,G,C, F,C,G,C];
  const hz = m => 440*Math.pow(2,(m-69)/12);

  let ctx=null, out=null, timer=null, bar=0, nextT=0, on=false, noiseBuf=null;
  function note(m, t, dur, type, vol, attack=.01){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=hz(m);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g).connect(out); o.start(t); o.stop(t+dur+.05);
  }
  function shaker(t, vol){
    const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    s.buffer=noiseBuf; f.type='highpass'; f.frequency.value=7000;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0005,t+.06);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t+.08);
  }
  function scheduleBar(b, t){
    const [root, tri] = CH[b];
    let step=0;
    for(const [m,len] of MEL[b]){ if(m) note(m, t+step*E8, len*E8*0.95, 'triangle', .22, .015); step+=len; }
    // bè trầm
    [[root,0],[root+7,2],[root+12,4],[root+7,6]].forEach(([m,s])=>note(m, t+s*E8, E8*1.8, 'sine', .32, .01));
    // đệm hợp âm (nảy nhẹ ở phách lẻ)
    [1,3,5,7].forEach((s,i)=>note(tri[i%3], t+s*E8, E8*0.9, 'square', .035, .005));
    // lắc nhịp
    for(let s=0;s<8;s++) shaker(t+s*E8, s%2? .05 : .09);
  }
  function tick(){
    while(nextT < ctx.currentTime + 0.25){
      scheduleBar(bar, nextT);
      nextT += 8*E8; bar = (bar+1) % MEL.length;
    }
  }
  return {
    start(c){
      if(on) return; ctx=c; on=true;
      if(!out){ out=ctx.createGain(); out.connect(ctx.destination);
        noiseBuf=ctx.createBuffer(1, ctx.sampleRate*.1, ctx.sampleRate);
        const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
      out.gain.cancelScheduledValues(ctx.currentTime);
      out.gain.setValueAtTime(0, ctx.currentTime); out.gain.linearRampToValueAtTime(.32, ctx.currentTime+.8);
      bar=0; nextT=ctx.currentTime+.1; tick(); timer=setInterval(tick, 60);
    },
    stop(){
      if(!on) return; on=false; clearInterval(timer);
      out.gain.cancelScheduledValues(ctx.currentTime);
      out.gain.setValueAtTime(out.gain.value, ctx.currentTime); out.gain.linearRampToValueAtTime(0, ctx.currentTime+.3);
    },
    duck(sec){
      if(!on || !out) return; const t=ctx.currentTime;
      out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value,t);
      out.gain.linearRampToValueAtTime(.08,t+.08); out.gain.setValueAtTime(.08,t+sec); out.gain.linearRampToValueAtTime(.32,t+sec+.6);
    },
    get playing(){ return on; }
  };
})();

/* Nhạc nền: dùng nhạc có sẵn hoặc bài cô chọn từ máy */
let musicOn = true, customAudio = null, musicStarted = false;
function musicPlay(){
  if(customAudio){ Music.stop(); customAudio.play().catch(()=>{}); }
  else { const c = audio(); if(c) Music.start(c); }
}
function musicPause(){ Music.stop(); if(customAudio) customAudio.pause(); }
function updateMusicBtn(){ const b=document.getElementById('bMusic'); b.classList.toggle('off', !musicOn); b.title = musicOn ? 'Tắt nhạc nền' : 'Bật nhạc nền'; }
// trình duyệt chỉ cho phát nhạc sau lần chạm đầu tiên
addEventListener('pointerdown', ()=>{ if(!musicStarted){ musicStarted=true; if(musicOn) musicPlay(); } }, {capture:true});
document.getElementById('bMusic').onclick = ()=>{ musicOn=!musicOn; musicStarted=true; musicOn ? musicPlay() : musicPause(); updateMusicBtn(); };
document.getElementById('bPick').onclick = ()=>document.getElementById('fileMusic').click();
document.getElementById('fileMusic').onchange = e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  if(customAudio){ customAudio.pause(); URL.revokeObjectURL(customAudio.src); }
  customAudio = new Audio(URL.createObjectURL(f)); customAudio.loop = true; customAudio.volume = .45;
  musicOn = true; musicStarted = true; updateMusicBtn(); musicPlay();
  bubbleAt(330, 730, '🎵 ' + f.name.replace(/\.[^.]+$/,'').slice(0,28));
};

addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});

build();
</script>
</body>
</html>
